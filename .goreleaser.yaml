version: 2

project_name: smpmon

before:
  hooks:
    - go mod tidy

builds:
  - id: smpmon
    main: ./cmd/smpmon
    binary: smpmon
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/hightemp/smpmon/internal/buildinfo.Version={{ .Version }}
      - -X github.com/hightemp/smpmon/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/hightemp/smpmon/internal/buildinfo.Date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - packaging/*

checksum:
  name_template: checksums.txt

nfpms:
  - id: packages
    package_name: smpmon
    homepage: https://github.com/hightemp/smpmon
    maintainer: hightemp
    description: A configurable terminal resource monitor with dashboards and graphs.
    license: MIT
    formats: [deb, rpm]
    contents:
      - src: packaging/smpmon-agent.service
        dst: /usr/lib/systemd/system/smpmon-agent.service
        file_info: {mode: 0644}
      - src: packaging/agent.env
        dst: /etc/smpmon/agent.env
        type: config|noreplace
        file_info: {mode: 0644}

# Package manager manifests go to separate repositories. Pushing there
# needs a token with write access (secret TAP_GITHUB_TOKEN); without it the
# release still succeeds and the manifests are just not updated.
homebrew_casks:
  - name: smpmon
    repository:
      owner: hightemp
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/hightemp/smpmon
    description: A configurable terminal resource monitor with dashboards and graphs.
    license: MIT
    binaries: [smpmon]
    commit_author:
      name: hightemp
      email: a01028536640@gmail.com
    skip_upload: '{{ if index .Env "TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    hooks:
      post:
        # The binary isn't notarized; drop the quarantine flag so macOS runs it.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/smpmon"]
          end

scoops:
  - name: smpmon
    repository:
      owner: hightemp
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/hightemp/smpmon
    description: A configurable terminal resource monitor with dashboards and graphs.
    license: MIT
    commit_author:
      name: hightemp
      email: a01028536640@gmail.com
    skip_upload: '{{ if index .Env "TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^Release v"

release:
  github:
    owner: hightemp
    name: smpmon
