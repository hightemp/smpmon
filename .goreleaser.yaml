version: 2

project_name: smpmon

before:
  hooks:
    - go mod tidy

builds:
  - id: smpmon
    main: ./cmd/smpmon
    binary: smpmon
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/hightemp/smpmon/internal/buildinfo.Version={{ .Version }}
      - -X github.com/hightemp/smpmon/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/hightemp/smpmon/internal/buildinfo.Date={{ .Date }}
    # macOS and Windows are added once their collectors exist (v1); CI
    # still cross-compiles them on every push.
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

nfpms:
  - id: packages
    package_name: smpmon
    homepage: https://github.com/hightemp/smpmon
    maintainer: hightemp
    description: A configurable terminal resource monitor with dashboards and graphs.
    license: MIT
    formats: [deb, rpm]

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^Release v"

release:
  github:
    owner: hightemp
    name: smpmon
